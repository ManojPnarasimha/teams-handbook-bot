services:
  - type: web
    name: tricongpt
    runtime: python
    plan: free
    autoDeploy: true

    # Build:
    # 1. Install Microsoft ODBC Driver 18 for SQL Server (needed by pyodbc/aioodbc
    #    to talk to Azure SQL Database).
    # 2. Install Python dependencies.
    #
    # Render's Python runtime runs the build as root, so apt-get + curl work.
    buildCommand: >-
      apt-get update &&
      apt-get install -y --no-install-recommends curl gnupg apt-transport-https unixodbc &&
      curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg &&
      echo "deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/mssql-release.list &&
      apt-get update &&
      ACCEPT_EULA=Y apt-get install -y msodbcsql18 &&
      pip install -r requirements.txt

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz

    envVars:
      # ---- Azure SQL Database ----
      # Full ODBC connection string (from Azure portal → SQL DB → Connection strings → ODBC).
      - key: AZURE_SQL_CONNECTION_STRING
        sync: false
      # Pool sizing — free-tier serverless allows only a handful of connections; keep small.
      - key: AZURE_SQL_POOL_MIN
        value: "1"
      - key: AZURE_SQL_POOL_MAX
        value: "4"

      # ---- Azure OpenAI (chat + embeddings) ----
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: "2024-10-21"
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        value: emb-small
      - key: AZURE_OPENAI_CHAT_DEPLOYMENT
        value: chat-mini
      - key: EMBEDDING_DIM
        value: "768"
      # Chunks per embeddings API call (endpoint accepts up to 2048).
      - key: EMBED_BATCH_SIZE
        value: "64"

      # ---- Azure Document Intelligence (OCR fallback only; PyMuPDF is primary) ----
      - key: AZURE_DOC_INTELLIGENCE_ENDPOINT
        sync: false
      - key: AZURE_DOC_INTELLIGENCE_KEY
        sync: false
      - key: AZURE_DOC_INTELLIGENCE_MODEL
        value: prebuilt-layout
      # Minimum chars PyMuPDF must extract before we trust it over the DI OCR fallback.
      - key: PYMUPDF_MIN_CHARS
        value: "200"

      # ---- LLM fallback (Groq) ----
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      # ---- Bot Framework / Azure Bot Service ----
      - key: MICROSOFT_APP_ID
        sync: false
      - key: MICROSOFT_APP_PASSWORD
        sync: false
      - key: MICROSOFT_APP_TYPE
        sync: false
      - key: MICROSOFT_APP_TENANT_ID
        sync: false

      # ---- SharePoint (Microsoft Graph via MSAL) ----
      - key: SHAREPOINT_TENANT_ID
        sync: false
      - key: SHAREPOINT_CLIENT_ID
        sync: false
      - key: SHAREPOINT_CLIENT_SECRET
        sync: false
      - key: SHAREPOINT_SITE_ID
        sync: false
      - key: SHAREPOINT_DRIVE_ID
        sync: false
      - key: SHAREPOINT_FOLDER_PATH
        sync: false
      - key: SHAREPOINT_RECURSIVE
        value: "0"

      # ---- Scheduled sync ----
      # Keep this off unless you wire an external cron. Manual ingestion via
      # `python ingest.py` is always available.
      - key: SCHEDULED_SYNC_ENABLED
        value: "0"
      - key: SYNC_SECRET
        sync: false

      # ---- Behaviour knobs ----
      - key: RAG_TOP_K
        value: "5"
      - key: RAG_SIMILARITY_THRESHOLD
        value: "0.55"
      - key: SHORT_TERM_LIMIT
        value: "10"
      - key: SUMMARY_EVERY_TURNS
        value: "20"
      - key: LOG_LEVEL
        value: INFO

      # ---- Chunking (ingest.py) ----
      - key: CHUNK_TARGET_CHARS
        value: "500"
      - key: CHUNK_MAX_CHARS
        value: "800"
      - key: CHUNK_OVERLAP_CHARS
        value: "80"
      - key: CHUNK_MIN_CHARS
        value: "80"
